name: Integration continue

on:
  push:
    branches: [main]
  pull_request:

# Le jeton de la CI ne peut que lire le depot : une action compromise ne pourrait rien pousser.
permissions:
  contents: read

# Les actions sont epinglees par empreinte de commit, pas par tag : un tag peut etre
# deplace par qui compromet le depot de l'action (cas reel : trivy-action, 2025).
# Pour mettre a jour : resoudre le nouveau tag en empreinte et garder le tag en commentaire.

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barryson
          POSTGRES_PASSWORD: barryson
          POSTGRES_DB: barryson_test
        options: >-
          --health-cmd "pg_isready -U barryson"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: barryson
      POSTGRES_PASSWORD: barryson
      POSTGRES_DB: barryson_test
      # Les tests tournent avec le compte a moindre privilege, comme l'API en production.
      POSTGRES_APP_USER: barryson_app
      POSTGRES_APP_PASSWORD: barryson_app_ci

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer libpq (client PostgreSQL du systeme)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq5 postgresql-client

      - name: Creer le compte applicatif a moindre privilege
        env:
          PGHOST: localhost
          PGPASSWORD: barryson
        run: sh docker/postgres/10-role-applicatif.sh

      - name: Installer les dependances
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Controle qualite du code
        working-directory: backend
        run: ruff check .

      - name: Appliquer les migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Tests
        working-directory: backend
        run: pytest -q

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances (versions du fichier verrou, rien d'autre)
        working-directory: frontend
        run: npm ci

      - name: Auditer les dependances
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Verifier les types (contrat d'API compris)
        working-directory: frontend
        run: npm run typecheck

      - name: Construire l'interface
        working-directory: frontend
        run: npm run build

  securite:
    # Gate de l'ADR 0004 : une vulnerabilite haute ou critique corrigeable bloque la fusion.
    # Une derogation doit etre ecrite, motivee et datee dans .trivyignore (racine du depot).
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Construire l'image de production de l'API
        # Sans INSTALLER_DEV : c'est l'image qui partira en production qui est scannee.
        run: docker build -t barryson-api:${{ github.sha }} backend

      - name: Scanner les dependances Python
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scanner les dependances de l'interface
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scanner l'image (systeme + bibliotheques)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: barryson-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
