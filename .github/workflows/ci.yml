name: Integration continue

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barryson
          POSTGRES_PASSWORD: barryson
          POSTGRES_DB: barryson_test
        options: >-
          --health-cmd "pg_isready -U barryson"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: barryson
      POSTGRES_PASSWORD: barryson
      POSTGRES_DB: barryson_test
      # Les tests tournent avec le compte a moindre privilege, comme l'API en production.
      POSTGRES_APP_USER: barryson_app
      POSTGRES_APP_PASSWORD: barryson_app_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer libpq (client PostgreSQL du systeme)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq5 postgresql-client

      - name: Creer le compte applicatif a moindre privilege
        env:
          PGHOST: localhost
          PGPASSWORD: barryson
        run: sh docker/postgres/10-role-applicatif.sh

      - name: Installer les dependances
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Controle qualite du code
        working-directory: backend
        run: ruff check .

      - name: Appliquer les migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Tests
        working-directory: backend
        run: pytest -q

  securite:
    # Gate de l'ADR 0004 : une vulnerabilite haute ou critique corrigeable bloque la fusion.
    # Une derogation doit etre ecrite, motivee et datee dans .trivyignore (racine du depot).
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image de production de l'API
        # Sans INSTALLER_DEV : c'est l'image qui partira en production qui est scannee.
        run: docker build -t barryson-api:${{ github.sha }} backend

      - name: Scanner les dependances Python
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scanner l'image (systeme + bibliotheques)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: barryson-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
